spring:
  application:
    name: ms-proveedores
  config:
    import: "optional:configserver:http://localhost:8091"
  datasource:
    # MySQL en Docker puerto 3307
    url: jdbc:mysql://localhost:3307/db_proveedores?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: mysql123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    serialization:
      indent-output: true

server:
  port: 8088

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# --- CONFIGURACIÓN DE MONITOREO (ACTUATOR) ---
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always